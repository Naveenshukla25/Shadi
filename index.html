<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ankit Mishra & Saumya Shukla — Shubh Vivah</title>

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Ankit Mishra & Saumya Shukla — Shubh Vivah">
  <meta property="og:description" content="You are warmly invited · 7–9 December 2026 · Prayagraj">
  <meta property="og:image" content="assets/monogram.png">
  <meta property="og:type" content="website">

  <!-- Google Fonts Preconnect & Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Hind:wght@400;500;600&family=Jost:wght@300;400;500&family=Noto+Serif+Devanagari:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Particle / Petal Canvas (Fixed, background) -->
  <canvas id="fx"></canvas>

  <!-- GATE (Entrance Experience) -->
  <div id="gate" role="dialog" aria-modal="true" aria-label="Wedding Gate Invitation">
    <div class="door l"></div>
    <div class="door r"></div>
    <div class="gc">
      <div class="ganesh-frame gate-ganesh" aria-label="Shri Ganesha">
        <img class="ganesh-photo" src="assets/ganesh.png" alt="श्री गणेशाय नमः" onerror="this.onerror=null; this.src='assets/ganesh.jpg';">
      </div>

      <div class="gan dv" data-t="gan">ॐ श्री गणेशाय नमः</div>

      <div class="seal">
        <img id="m1" src="assets/monogram.png" alt="A·S" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'A·S'}))">
      </div>

      <h1 class="nm" id="gn"></h1>
      <p id="gd"></p>

      <div class="gate-actions">
        <button id="ob" class="btn-primary" data-t="open">Open Invitation</button>
        <button class="lg btn-lang" data-lg>हिंदी</button>
      </div>
    </div>
  </div>

  <!-- TOP BAR (Slides down when gate opens) -->
  <header id="bar">
    <button id="pp" aria-label="Play/Pause music" title="Toggle Music">♪</button>
    <div class="bar-center">
      <img class="bar-ganesh" src="assets/ganesh.png" alt="श्री गणेश" onerror="this.onerror=null; this.src='assets/ganesh.jpg';">
      <span class="bar-title">A &bull; S</span>
    </div>
    <button class="lg btn-lang-sm" data-lg>हिंदी</button>
  </header>

  <!-- MAIN INVITATION CONTENT -->
  <main>
    <!-- 1. HERO -->
    <section id="hero" data-p="rose">
      <!-- Rajasthani cusped Jharokha arch with Shri Ganesha center-aligned inside -->
      <div class="jharokha-wrap" aria-label="Shri Ganesha inside Jharokha Dome">
        <svg class="jharokha-svg" viewBox="0 0 320 380" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <!-- Finial / Kalash -->
          <path class="jharokha-path" d="M160 12 L163 22 L168 25 L160 30 L152 25 L157 22 Z" stroke-width="1.4" />
          <circle class="jharokha-path" cx="160" cy="8" r="2" fill="none" stroke-width="1.4" />
          <!-- Outer Arch Trim -->
          <path class="jharokha-path" d="M35 340 L35 170 Q35 110 95 65 Q135 35 160 30 Q185 35 225 65 Q285 110 285 170 L285 340" stroke-width="1.2" stroke-dasharray="2 3" />
          <!-- Main Cusped Multifoil Arch -->
          <path class="jharokha-path main-arch" d="M48 340 L48 165 C48 145 62 135 72 135 C85 135 94 122 96 108 C102 92 118 84 130 84 C140 84 148 76 152 64 C154 58 157 52 160 48 C163 52 166 58 168 64 C172 76 180 84 190 84 C202 84 218 92 224 108 C226 122 235 135 248 135 C258 135 272 145 272 165 L272 340" stroke-width="1.8" />
          <!-- Pillars & Capital Moldings -->
          <path class="jharokha-path" d="M40 165 L56 165 M264 165 L280 165" stroke-width="1.6" />
          <path class="jharokha-path" d="M38 340 L58 340 M262 340 L282 340" stroke-width="2" />
          <!-- Base Moldings -->
          <path class="jharokha-path" d="M30 355 L66 355 M254 355 L290 355" stroke-width="1.5" />
          <path class="jharokha-path" d="M24 362 L72 362 M248 362 L296 362" stroke-width="1.5" />
        </svg>

        <div class="jharokha-inner">
          <div class="ganesh-frame hero-ganesh" aria-label="Shri Ganesha">
            <img class="ganesh-photo" src="assets/ganesh.png" alt="श्री गणेशाय नमः" onerror="this.onerror=null; this.src='assets/ganesh.jpg';">
          </div>
          <div class="gan dv" data-t="gan">ॐ श्री गणेशाय नमः</div>
        </div>
      </div>
      <h1 class="nm" id="hn"></h1>
      <p class="sub" data-t="inv"></p>
      <p id="hd"></p>

      <!-- Lotus line divider SVG -->
      <div class="lotus-divider" aria-hidden="true">
        <svg viewBox="0 0 320 36" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <!-- Left flourish -->
          <path d="M12 18 L110 18 M110 18 Q125 18 132 10 Q138 2 144 14" />
          <circle cx="16" cy="18" r="2" fill="currentColor" />
          <!-- Right flourish -->
          <path d="M308 18 L210 18 M210 18 Q195 18 188 10 Q182 2 176 14" />
          <circle cx="304" cy="18" r="2" fill="currentColor" />
          <!-- Center Lotus Blossom -->
          <path d="M160 6 C163 12 165 20 160 26 C155 20 157 12 160 6 Z" fill="currentColor" fill-opacity="0.1" />
          <path d="M160 14 C167 17 172 23 169 28 C163 26 161 22 160 14 Z" />
          <path d="M160 14 C153 17 148 23 151 28 C157 26 159 22 160 14 Z" />
          <path d="M160 20 C173 21 179 26 177 31 C169 31 163 26 160 20 Z" />
          <path d="M160 20 C147 21 141 26 143 31 C151 31 157 26 160 20 Z" />
          <circle cx="160" cy="30" r="1.5" fill="currentColor" />
        </svg>
      </div>
    </section>

    <!-- 2. BLESSINGS -->
    <section id="bless" data-p="genda">
      <div class="mandala" aria-hidden="true">
        <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="0.8">
          <circle cx="100" cy="100" r="92" stroke-dasharray="2 3" />
          <circle cx="100" cy="100" r="82" />
          <circle cx="100" cy="100" r="64" />
          <circle cx="100" cy="100" r="44" stroke-dasharray="3 3" />
          <circle cx="100" cy="100" r="24" />
          <!-- 12-petal radial geometry -->
          <path d="M100 8 C108 40 120 52 152 60 C120 68 108 80 100 112 C92 80 80 68 48 60 C80 52 92 40 100 8 Z" />
          <path d="M100 8 C108 40 120 52 152 60 C120 68 108 80 100 112 C92 80 80 68 48 60 C80 52 92 40 100 8 Z" transform="rotate(45 100 100)" />
          <path d="M100 8 C108 40 120 52 152 60 C120 68 108 80 100 112 C92 80 80 68 48 60 C80 52 92 40 100 8 Z" transform="rotate(30 100 100)" />
          <path d="M100 8 C108 40 120 52 152 60 C120 68 108 80 100 112 C92 80 80 68 48 60 C80 52 92 40 100 8 Z" transform="rotate(60 100 100)" />
        </svg>
      </div>

      <h2 data-t="bl"></h2>

      <div class="ganesh-frame bless-ganesh" aria-label="Shri Ganesha">
        <img class="ganesh-photo" src="assets/ganesh.png" alt="श्री गणेशाय नमः" onerror="this.onerror=null; this.src='assets/ganesh.jpg';">
      </div>

      <p class="dv sh">वक्रतुण्ड महाकाय सूर्यकोटि समप्रभ।<br>निर्विघ्नं कुरु मे देव सर्वकार्येषु सर्वदा॥</p>
      <p class="bln-text" data-t="bln"></p>
    </section>

    <!-- 3. FORMAL INVITATION CARD -->
    <section id="card" data-p="lotus">
      <div class="mandala" aria-hidden="true">
        <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="0.8">
          <circle cx="100" cy="100" r="90" stroke-dasharray="3 3" />
          <circle cx="100" cy="100" r="70" />
          <circle cx="100" cy="100" r="50" />
          <path d="M100 10 C120 50 150 80 190 100 C150 120 120 150 100 190 C80 150 50 120 10 100 C50 80 80 50 100 10 Z" />
          <path d="M100 10 C120 50 150 80 190 100 C150 120 120 150 100 190 C80 150 50 120 10 100 C50 80 80 50 100 10 Z" transform="rotate(45 100 100)" />
        </svg>
      </div>

      <h2 data-t="fi"></h2>
      <div class="paper">
        <div class="paper-corner tl"></div>
        <div class="paper-corner tr"></div>
        <div class="paper-corner bl"></div>
        <div class="paper-corner br"></div>
        <div id="ct"></div>
      </div>
    </section>

    <!-- 4. COUNTDOWN -->
    <section id="cdn" data-p="pink">
      <div class="mandala" aria-hidden="true">
        <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="0.8">
          <circle cx="100" cy="100" r="88" stroke-dasharray="2 4" />
          <circle cx="100" cy="100" r="66" />
          <circle cx="100" cy="100" r="44" />
          <path d="M100 20 C110 55 145 90 180 100 C145 110 110 145 100 180 C90 145 55 110 20 100 C55 90 90 55 100 20 Z" />
        </svg>
      </div>

      <h2 data-t="cd"></h2>
      <div id="cd" aria-live="polite"></div>
    </section>

    <!-- 5. WEDDING FUNCTIONS -->
    <section id="fn" data-p="ashoka">
      <div class="mandala" aria-hidden="true">
        <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="0.8">
          <circle cx="100" cy="100" r="90" stroke-dasharray="4 4" />
          <circle cx="100" cy="100" r="76" />
          <circle cx="100" cy="100" r="54" />
          <path d="M100 12 Q112 50 150 50 Q188 50 200 100 Q188 150 150 150 Q112 150 100 188 Q88 150 50 150 Q12 150 0 100 Q12 50 50 50 Q88 50 100 12 Z" />
        </svg>
      </div>

      <h2 data-t="fn"></h2>
      <div id="tl"></div>
    </section>

    <!-- 6. GALLERY -->
    <section id="gal" data-p="bougain">
      <div class="mandala" aria-hidden="true">
        <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="0.8">
          <circle cx="100" cy="100" r="85" />
          <circle cx="100" cy="100" r="65" stroke-dasharray="2 3" />
          <circle cx="100" cy="100" r="45" />
        </svg>
      </div>

      <h2 data-t="gal"></h2>
      <div class="gal-slider-container" id="gal-container">
        <div class="gal-track-wrap" id="gal-wrap">
          <div class="gal-track" id="gal-track">
            <div class="gal-item placeholder"><i></i></div>
            <div class="gal-item placeholder"><i></i></div>
            <div class="gal-item placeholder"><i></i></div>
            <div class="gal-item placeholder"><i></i></div>
            <div class="gal-item placeholder"><i></i></div>
            <div class="gal-item placeholder"><i></i></div>
          </div>
        </div>
      </div>
      <p data-t="gal2" class="gal-sub"></p>
    </section>

    <!-- 7. CLOSING -->
    <section id="end" data-p="glitter">
      <div class="mandala" aria-hidden="true">
        <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="0.8">
          <circle cx="100" cy="100" r="92" stroke-dasharray="1 3" />
          <circle cx="100" cy="100" r="78" />
          <circle cx="100" cy="100" r="50" />
        </svg>
      </div>

      <h2 data-t="ty"></h2>
      <div class="btns">
        <button id="sh" class="btn-action" data-t="share"></button>
        <button id="cp" class="btn-action" data-t="copy"></button>
        <button onclick="window.print()" class="btn-action" data-t="pdf"></button>
      </div>

      <h3 data-t="rsvp"></h3>
      <div id="rs"></div>

      <button onclick="window.scrollTo({top:0,behavior:'smooth'})" class="btn-top" data-t="top"></button>
    </section>
  </main>

  <!-- Audio Element -->
  <audio id="au" loop preload="none"></audio>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
